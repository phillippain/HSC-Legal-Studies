<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crime Multiple Choice Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--surface:#fff;--surface2:#e9eff3;--ink:#10222B;--ink2:#4a5e69;--line:#d3dde3;--harbour:#0B4F6C;--teal:#0E7C86;--coral:#E4572E;--gold:#E3B341;
--ok:#17693a;--ok-t:#dcf2e4;--bad:#a3212b;--bad-t:#fde6e7;--shadow:0 1px 2px rgba(11,79,108,.08),0 6px 18px rgba(11,79,108,.08);
--t1:#0E7C86;--t2:#E4572E;--t3:#6D4AFF;--t4:#B7860B;--t5:#2E9E5B;--t6:#2563EB;
--display:"Poppins","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a21;--surface:#14262f;--surface2:#1c3340;--ink:#e8f1f5;--ink2:#9db4c0;--line:#2a4655;--ok:#6fd596;--ok-t:#13341f;--bad:#ff8f97;--bad-t:#40191d;--t4:#E3B341;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(135deg,var(--harbour),var(--teal));color:#fff;padding:22px 14px 26px;margin-bottom:-14px}
header .in{max-width:900px;margin:0 auto}
header h1{font:800 26px/1.15 var(--display)}
header p{opacity:.9;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stat{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font:800 24px var(--display);color:var(--harbour)}
@media(prefers-color-scheme:dark){.stat b{color:#6cc5d1}}
.stat small{color:var(--ink2)}
h2{font:700 17px var(--display);margin:18px 0 8px}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.topic{border-left:6px solid var(--c);background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.topic b{display:block}
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c);width:0}
.topic small{color:var(--ink2)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{border:0;text-align:left;border-radius:16px;padding:16px;color:#fff;box-shadow:var(--shadow);background:var(--m)}
.mode .e{font-size:28px}.mode b{display:block;font:700 17px var(--display);margin-top:4px}.mode span{opacity:.92;font-size:13.5px}
.mode:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;margin-top:14px}
/* quiz */
.top{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.top .sp{flex:1}
.pill{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c)}
.pill.src{background:var(--surface2);color:var(--ink2)}
.timer{font:700 16px var(--display);font-variant-numeric:tabular-nums;background:var(--surface);padding:4px 12px;border-radius:999px;box-shadow:var(--shadow)}
.timer.low{color:var(--coral)}
.prog{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--harbour);transition:width .3s}
.q{font:600 18px/1.4 var(--display);margin-bottom:14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--harbour)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700}
.opt.sel{border-color:var(--harbour);background:var(--surface2)}
.opt.right{border-color:var(--ok);background:var(--ok-t)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-t)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--surface);border-left:6px solid var(--ok);box-shadow:var(--shadow)}
.fb.no{border-left-color:var(--bad)}
.fb h3{font:700 16px var(--display);margin-bottom:4px}
.fb .ev{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.fb .ev a{background:var(--surface2);color:var(--harbour);border-radius:999px;padding:3px 10px;text-decoration:none;font-weight:600}
@media(prefers-color-scheme:dark){.fb .ev a{color:#6cc5d1}}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--harbour);color:#fff}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
/* results */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--surface2) 0)}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 24px var(--display)}
.rv{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rv summary{padding:10px 12px;cursor:pointer;font-weight:600}
.rv .b{padding:0 12px 12px}.rv.ok summary::before{content:"✔ ";color:var(--ok)}.rv.no summary::before{content:"✘ ";color:var(--bad)}
.hide{display:none}
</style>

<script>
const DATA=[{"id":"n1-11","tp":1,"src":"Practice question","q":"Which statement best defines a crime?","o":["Conduct prohibited by the State and punishable by the criminal law","Any behaviour that most people consider immoral","A dispute between two parties settled by compensation","Any action that harms another person"],"a":0,"x":"A crime is a wrong against the community defined by law and punished by the State. Immoral or harmful conduct is not a crime unless the law says so, and civil disputes are about compensation between parties.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"n1-12","tp":1,"src":"Practice question","q":"Sam punches Lee in a pub fight. Lee falls, hits his head and dies. To convict Sam of homicide, the prosecution must prove Sam's act was","o":["a substantial and operating cause of Lee's death","the only cause of Lee's death","a possible cause of Lee's death","a cause that Sam foresaw in detail"],"a":0,"x":"Causation requires the act to be a <b>substantial and operating cause</b> of death (<i>Royall v The Queen</i>). It need not be the sole cause.","ev":[{"id":"royall-v-the-queen-1991","t":"Royall v The Queen"}]},{"id":"n1-13","tp":1,"src":"Practice question","q":"Which of the following is an offence against the person?","o":["Common assault","Larceny","Money laundering","Offensive language"],"a":0,"x":"Assault harms or threatens a person directly. Larceny is a property offence, money laundering is an economic offence and offensive language is a public order offence.","ev":[{"id":"crimes-act-1900-key-offences","t":"Crimes Act 1900 (NSW): key offences"}]},{"id":"n1-14","tp":1,"src":"Practice question","q":"Which of the following is a preliminary crime?","o":["Conspiracy to import drugs","Fraud","Manslaughter","Offensive behaviour"],"a":0,"x":"Preliminary crimes (attempt, conspiracy, incitement) punish steps taken towards an offence before it is completed.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"n1-15","tp":1,"src":"Practice question","q":"Which of the following is a form of mens rea for murder in NSW?","o":["Reckless indifference to human life","Being present when a death occurs","Causing death by accident","Taking part in a fight"],"a":0,"x":"Murder requires an intention to kill or cause grievous bodily harm, or <b>reckless indifference to human life</b>. Accidental death or mere presence does not meet that mental element.","ev":[{"id":"crimes-act-1900-key-offences","t":"Crimes Act 1900 (NSW): key offences"}]},{"id":"n1-16","tp":1,"src":"Practice question","q":"A person who uses offensive language in a public place has most likely committed a","o":["summary public order offence","preliminary crime","drug offence","white collar crime"],"a":0,"x":"Offensive language is a minor public order offence dealt with summarily by a magistrate in the Local Court.","ev":[{"id":"summary-offences-act-1988","t":"Summary Offences Act 1988 (NSW)"}]},{"id":"n1-17","tp":1,"src":"Practice question","q":"A rise in petrol drive-offs when fuel prices climb is best explained by which factor in crime?","o":["Economic factors","Political factors","Genetic factors","Cultural traditions"],"a":0,"x":"Rising costs create financial pressure, which makes theft more attractive to some people, so economic factors are the best fit.","ev":[{"id":"bocsar-cjb280-petrol-thefts","t":"BOCSAR CJB 280 (petrol thefts)"}]},{"id":"n1-18","tp":1,"src":"Practice question","q":"Community-led programs in Bourke that aim to address the causes of offending are best described as","o":["social crime prevention","situational crime prevention","retribution","police discretion"],"a":0,"x":"Social prevention tackles underlying causes such as disadvantage and lack of opportunity. Situational prevention changes the environment to reduce opportunity.","ev":[{"id":"maranguka-justice-reinvestment-bourke","t":"Maranguka (Bourke)"}]},{"id":"n1-19","tp":1,"src":"Practice question","q":"Which person is a principal in the first degree?","o":["The person who commits the criminal act","The person who plans the crime beforehand","The person who hides the offender afterwards","The person who keeps watch nearby"],"a":0,"x":"The principal in the first degree physically commits the offence. Planners are accessories before the fact, lookouts are principals in the second degree and those who help afterwards are accessories after the fact.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"n1-20","tp":1,"src":"Practice question","q":"Which statement about summary offences is correct?","o":["They are less serious and usually heard by a magistrate without a jury","They are always heard in the Supreme Court","They must be tried before a jury","They are heard only in the District Court"],"a":0,"x":"Summary offences are minor and dealt with in the Local Court by a magistrate alone. Indictable offences are more serious and may go to a jury trial in a higher court.","ev":[{"id":"summary-offences-act-1988","t":"Summary Offences Act 1988 (NSW)"}]},{"id":"p2011q1","tp":1,"src":"Past HSC 2011 Q1","q":"What is the use of surveillance cameras in public places an example of?","o":["Retribution","Restorative justice","Social crime prevention","Situational crime prevention"],"a":3,"x":"CCTV changes the physical environment so crime is harder or riskier: that is <b>situational</b> crime prevention. Social prevention tackles root causes (for example poverty or boredom); retribution and restorative justice are sentencing aims, not prevention.","ev":[{"id":"nsw-mobile-phone-detection-cameras","t":"Phone detection cameras"}]},{"id":"p2013q4","tp":1,"src":"Past HSC 2013 Q4","q":"In the strict liability offence of selling alcohol to a 16-year-old, which of the following must be proven?","o":["Mens rea","Causation","Actus reus","Recklessness"],"a":2,"x":"In a strict liability offence the prosecution proves only the <b>actus reus</b> (the sale). Mens rea does not have to be proved, although the accused may raise an honest and reasonable mistake of fact.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"p2015q3","tp":1,"src":"Past HSC 2015 Q3","q":"Michael travels by public transport to his office in the city. He has been caught travelling without a valid ticket. What types of offences have been committed by Michael?","o":["Summary and public order","Summary and strict liability","White collar and public order","White collar and strict liability"],"a":1,"x":"Fare evasion is a minor offence dealt with summarily in the Local Court, and the prosecution does not need to prove intent, so it is a <b>summary, strict liability</b> offence. It is not white collar and not a public order offence.","ev":[{"id":"summary-offences-act-1988","t":"Summary Offences Act 1988 (NSW)"}]},{"id":"p2016q10","tp":1,"src":"Past HSC 2016 Q10","q":"An employee of a bank becomes aware of confidential information which will increase the bank’s share price. Before the information is publicly released, the employee buys shares in the bank. What is this an example of?","o":["A conspiracy","A preliminary offence","An economic offence","A public order offence"],"a":2,"x":"Misusing confidential information for a financial advantage (insider trading) is an <b>economic</b> (white collar) offence committed in a business setting, not a public order or preliminary offence.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"p2017q10","tp":1,"src":"Past HSC 2017 Q10","q":"Jordan commits a serious criminal offence. Derek then helps Jordan conceal this offence. Which offence has Derek committed?","o":["Accessory after the fact","Accessory before the fact","Principal in the first degree","Principal in the second degree"],"a":0,"x":"Helping an offender <b>after</b> the crime, for example by concealing it, makes Derek an <b>accessory after the fact</b>. Before-the-fact helpers assist in planning or supplying; principals commit the offence.","ev":[{"id":"crimes-act-s316-s316a-concealment","t":"Crimes Act ss 316, 316A"}]},{"id":"p2018q8","tp":1,"src":"Past HSC 2018 Q8","q":"Mary was found to be an accessory before the fact in a bank robbery. Which of the following would have led to this finding?","o":["Mary supplied the gun that was used.","Mary used the gun at the crime scene.","Mary carried the money out of the bank.","Mary hid the money taken from the bank."],"a":0,"x":"An <b>accessory before the fact</b> assists or encourages before the crime without taking part: supplying the gun. Using the gun makes her a principal; carrying the money out is part of the crime itself; hiding the money afterwards makes her an accessory after the fact.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"p2019q2","tp":1,"src":"Past HSC 2019 Q2","q":"Alex is arrested on her way to rob a bank. What category of crime can she be charged with?","o":["Driving","Economic","Preliminary","Public Order"],"a":2,"x":"No robbery has happened yet, but being on the way to commit it points to a <b>preliminary crime</b> (attempt, conspiracy, incitement), which targets steps taken before the main offence.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"p2020q3","tp":1,"src":"Past HSC 2020 Q3","q":"Which term refers to a person’s intention to commit a crime?","o":["Mens rea","Actus reus","Doli incapax","Ratio decidendi"],"a":0,"x":"<b>Mens rea</b> is the 'guilty mind', the intention or knowledge needed for a crime. Actus reus is the guilty act; doli incapax is the presumption protecting children; ratio decidendi is the legal reasoning in a case.","ev":[{"id":"erin-patterson-crime-concepts","t":"Erin Patterson — crime concepts"}]},{"id":"p2021q7","tp":1,"src":"Past HSC 2021 Q7","q":"A mobile detection camera captures a motor vehicle driver illegally using their phone. If the matter goes to court, which of the following must be proven?","o":["Mens rea","Actus reus","Mens rea and causation","Actus reus, causation and mens rea"],"a":1,"x":"Illegal phone use is a strict liability offence, so only the <b>actus reus</b> (holding or using the phone while driving) needs to be proved. The camera image is evidence of that act.","ev":[{"id":"nsw-mobile-phone-detection-cameras","t":"Phone detection cameras"}]},{"id":"p2022q13","tp":1,"src":"Past HSC 2022 Q13","q":"Kerry and Blair enter a local supermarket together. Kerry asks Blair to keep a look out for a security guard while she places several packets of batteries inside her jacket. In-store video surveillance captures the incident. Which term best describes Blair’s role?","o":["Accessory after the fact","Accessory before the fact","Principal in the first degree","Principal in the second degree"],"a":3,"x":"Blair is present at the scene and helping (keeping watch) while Kerry steals, so he is a <b>principal in the second degree</b>. Kerry, who commits the act, is the principal in the first degree.","ev":[{"id":"crime-nature-and-classification","t":"Nature of crime — classification"}]},{"id":"n2-11","tp":2,"src":"Practice question","q":"Under LEPRA, police may stop and search a person without a warrant if they have","o":["reasonable grounds to suspect the person has a prohibited item","a hunch about the person","a neighbour's complaint with no detail","a belief the person is in a high crime suburb"],"a":0,"x":"Search powers without warrant need <b>reasonable suspicion</b> based on facts, not hunches or location alone. This protects individual liberty.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"n2-12","tp":2,"src":"Practice question","q":"Under the Bail Act 2013 (NSW), the main question for a bail decision maker is whether there is","o":["an unacceptable risk if the accused is released","proof the accused is guilty","a victim who objects to bail","a previous conviction of any kind"],"a":0,"x":"The Bail Act asks whether there is an <b>unacceptable risk</b> that the accused will fail to appear, commit a serious offence, endanger safety or interfere with witnesses. Guilt is not decided at bail.","ev":[{"id":"bail-act-2013","t":"Bail Act 2013 (NSW)"}]},{"id":"n2-13","tp":2,"src":"Practice question","q":"When an Aboriginal or Torres Strait Islander person is taken into custody in NSW, police must notify","o":["the Aboriginal Legal Service through the Custody Notification Service","the Director of Public Prosecutions","the Minister for Police","the person's employer"],"a":0,"x":"The Custody Notification Service provides a legal check on the welfare of every Aboriginal person taken into custody, a response to deaths in custody.","ev":[{"id":"custody-notification-service","t":"Custody Notification Service"}]},{"id":"n2-14","tp":2,"src":"Practice question","q":"Which Act regulates how police may take DNA samples and other forensic procedures from suspects in NSW?","o":["Crimes (Forensic Procedures) Act 2000","Bail Act 2013","Jury Act 1977","Evidence Act 1995"],"a":0,"x":"The Crimes (Forensic Procedures) Act 2000 sets out when and how forensic procedures can be carried out, including consent and court orders.","ev":[{"id":"crimes-forensic-procedures-act-2000","t":"Forensic Procedures Act 2000 (NSW)"}]},{"id":"n2-15","tp":2,"src":"Practice question","q":"What is true when a suspect is questioned by NSW police?","o":["The suspect does not have to answer and must be cautioned before questioning","The suspect must answer if innocent","Silence counts as an admission of guilt","The suspect may stay silent only if a lawyer is present"],"a":0,"x":"The right to silence is a basic protection. Police must give a caution that the person does not have to say anything, and silence is not itself proof of guilt.","ev":[{"id":"detention-and-interrogation-rights","t":"Detention and interrogation"}]},{"id":"n2-16","tp":2,"src":"Practice question","q":"How can a member of the public assist the investigation of crime?","o":["By reporting a suspected offence to police or Crime Stoppers","By deciding the charges that police lay","By issuing a warrant","By interrogating a suspect"],"a":0,"x":"Reports from the public often start investigations. Charging, warrants and questioning are police and court functions.","ev":[{"id":"reporting-and-investigating-crime","t":"Reporting and investigating crime"}]},{"id":"n2-17","tp":2,"src":"Practice question","q":"Police can give a 'move on' direction to a person in a public place when their behaviour is","o":["obstructing people or traffic or causing fear to others","unusual in appearance","carried out in the evening","a breach of the person's bail only"],"a":0,"x":"LEPRA lets police give reasonable directions where behaviour is obstructing others, harassing or intimidating, or involves supply of drugs. Appearance alone is not enough.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"n2-18","tp":2,"src":"Practice question","q":"To detain a suspect for questioning beyond the initial investigation period, police need","o":["a detention warrant from an authorised officer such as a magistrate","the suspect's permission","the Premier's approval","a jury's decision"],"a":0,"x":"LEPRA caps the period police can detain a person for investigation. Extensions require a <b>detention warrant</b> from an authorised officer, giving judicial oversight.","ev":[{"id":"detention-and-interrogation-rights","t":"Detention and interrogation"}]},{"id":"n2-19","tp":2,"src":"Practice question","q":"Which is a purpose of attaching conditions to bail?","o":["To reduce the risk the accused will reoffend or fail to appear while still allowing liberty","To punish the accused before trial","To prove the accused is guilty","To remove the right to silence"],"a":0,"x":"Bail conditions (reporting, curfews, surrender of passport) manage risk while respecting the presumption of innocence. They are not punishment.","ev":[{"id":"bail-act-2013","t":"Bail Act 2013 (NSW)"}]},{"id":"n2-20","tp":2,"src":"Practice question","q":"The Farah Jama case (2009) demonstrates the importance of","o":["reliable handling of forensic evidence such as DNA","faster police pursuits","longer detention periods","mandatory sentencing"],"a":0,"x":"Jama was wrongly convicted after DNA evidence was contaminated, showing why forensic evidence must be collected, stored and tested reliably.","ev":[{"id":"farah-jama-2009","t":"Farah Jama"}]},{"id":"p2011q12","tp":2,"src":"Past HSC 2011 Q12","q":"A police officer issues a caution instead of an on-the-spot fine to a person whose car is illegally parked. What is the police officer's action an example of?","o":["Discretion","Corruption","A breach of criminal law","A breach of the rule of law"],"a":0,"x":"Choosing to caution instead of fine is an exercise of <b>police discretion</b>. It is lawful and common, not corruption or a breach of the rule of law.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"p2012q15","tp":2,"src":"Past HSC 2012 Q15","q":"An accused is considered innocent until proven guilty. Which of the following best reflects this principle?","o":["Bail","Remand","Suspended sentence","No conviction recorded"],"a":0,"x":"Bail lets an accused stay free until proven guilty, so it best reflects the <b>presumption of innocence</b>. Remand is the opposite (held in custody).","ev":[{"id":"bail-act-2013","t":"Bail Act 2013 (NSW)"}]},{"id":"p2013q15","tp":2,"src":"Past HSC 2013 Q15","q":"Melanie has been arrested and a magistrate has determined that the case will proceed to trial. The magistrate has decided not to release her while waiting for the trial to be held. Which of the following correctly describes Melanie's situation?","o":["She is on bail.","She is in custody.","She is on remand.","She is in detention."],"a":2,"x":"A person refused bail and held in custody until trial is on <b>remand</b>. Custody and detention are broader terms; bail is the opposite outcome.","ev":[{"id":"bail-act-2013","t":"Bail Act 2013 (NSW)"}]},{"id":"p2015q8","tp":2,"src":"Past HSC 2015 Q8","q":"Which of the following requires a person to attend court?","o":["Caution","Arrest","Summons","Infringement notice"],"a":2,"x":"A <b>summons</b> (or court attendance notice) orders a person to attend court. A caution and an infringement notice avoid court, while arrest is the physical taking into custody.","ev":[{"id":"criminal-procedure-act-1986","t":"Criminal Procedure Act 1986 (NSW)"}]},{"id":"p2016q14","tp":2,"src":"Past HSC 2016 Q14","q":"Police receive information that a suspect’s house is being used to manufacture large quantities of drugs for sale interstate. In which of the following situations can police search the suspect’s house?","o":["A warrant has been granted.","A summons has been served.","The prosecutor authorises a search.","The Public Defender authorises a search."],"a":0,"x":"A <b>search warrant</b>, granted by a judicial officer on reasonable grounds, authorises police to search premises. A summons orders attendance at court; prosecutors and Public Defenders cannot authorise searches.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"p2017q6","tp":2,"src":"Past HSC 2017 Q6","q":"Who would usually issue an arrest warrant?","o":["The police","The Premier","A judicial officer","The Attorney-General"],"a":2,"x":"Arrest warrants are issued by an independent <b>judicial officer</b> (a magistrate or authorised officer). This oversight stops police authorising their own most intrusive powers.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"p2018q12","tp":2,"src":"Past HSC 2018 Q12","q":"A police officer orders a person to come with her to a police station. What is this an example of?","o":["Seizing evidence","Arresting a person","Issuing a summons","Interrogating a person"],"a":1,"x":"Ordering a person to go with police to a station deprives them of liberty, which is an <b>arrest</b>. Under LEPRA it must be based on reasonable grounds and used when necessary.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"p2019q10","tp":2,"src":"Past HSC 2019 Q10","q":"Which of the following describes a situation where police require a warrant?","o":["To question a suspect","To record a phone conversation","To search a car suspected of containing illegal drugs","To pull over a person suspected of driving a stolen car"],"a":1,"x":"Recording a private phone conversation (a listening device or interception) needs a <b>warrant</b>. Police can question a suspect, pull over a driver and search a car on reasonable suspicion without one.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"p2020q2","tp":2,"src":"Past HSC 2020 Q2","q":"What is the first step in the criminal investigation process?","o":["An offence is reported.","A suspect is interrogated.","A search warrant is issued.","Some evidence is obtained."],"a":0,"x":"The investigation begins when an <b>offence is reported</b> (by a victim, witness or police). Evidence, warrants and interrogation all follow.","ev":[{"id":"reporting-and-investigating-crime","t":"Reporting and investigating crime"}]},{"id":"p2024q4","tp":2,"src":"Past HSC 2024 Q4","q":"When can a NSW police officer arrest a person?","o":["Only when the officer possesses a warrant","When observing a person with a criminal record","When witnessing a group of young people gathered in a public place","When having reasonable grounds to suspect that a crime has been committed"],"a":3,"x":"Police may arrest, with or without a warrant, when they have <b>reasonable grounds to suspect</b> an offence and arrest is necessary under LEPRA. A warrant is not always needed.","ev":[{"id":"lepra-2002","t":"LEPRA 2002 (NSW)"}]},{"id":"n3-11","tp":3,"src":"Practice question","q":"Which court usually hears the most serious indictable offences such as murder in NSW?","o":["Supreme Court","Local Court","Children's Court","Coroner's Court"],"a":0,"x":"Murder is tried in the Supreme Court. The Local Court deals with summary offences and committal hearings.","ev":[{"id":"the-adversary-system-and-court-jurisdiction","t":"Jurisdiction and the adversary system"}]},{"id":"n3-12","tp":3,"src":"Practice question","q":"The 'golden thread' in Woolmington v DPP (1935) refers to the principle that","o":["the prosecution must prove guilt beyond reasonable doubt","the accused must prove innocence","the judge decides guilt","a jury must be unanimous"],"a":0,"x":"<i>Woolmington</i> confirmed the presumption of innocence: the burden of proof stays on the prosecution throughout.","ev":[{"id":"woolmington-v-dpp-1935","t":"Woolmington v DPP"}]},{"id":"n3-13","tp":3,"src":"Practice question","q":"In Dietrich v The Queen (1992) the High Court held that","o":["an unrepresented accused facing a serious charge may have the trial stayed if it would be unfair","every accused has an absolute right to a free lawyer","legal aid must be given to all accused","a trial can proceed without a judge"],"a":0,"x":"The High Court recognised no absolute right to publicly funded counsel, but a trial may be stayed if lack of representation would make it unfair.","ev":[{"id":"dietrich-v-the-queen-1992","t":"Dietrich v The Queen"}]},{"id":"n3-14","tp":3,"src":"Practice question","q":"Which of the following is a role of the Public Defender?","o":["To represent accused persons, especially in serious matters, often with legal aid","To prosecute the accused for the State","To decide guilt","To investigate the offence"],"a":0,"x":"Public Defenders are barristers who represent accused persons, mostly in serious cases, supporting the right to legal representation.","ev":[{"id":"public-defenders-act-1995","t":"Public Defenders Act 1995 (NSW)"}]},{"id":"n3-15","tp":3,"src":"Practice question","q":"Which statement about hearsay evidence is correct?","o":["It is an out-of-court statement offered to prove its truth and is generally inadmissible, subject to exceptions","It is always admissible","It only applies to expert witnesses","It is evidence given by the accused"],"a":0,"x":"The Evidence Act 1995 excludes hearsay because the maker cannot be cross-examined, but contains exceptions.","ev":[{"id":"evidence-act-1995","t":"Evidence Act 1995 (NSW)"}]},{"id":"n3-16","tp":3,"src":"Practice question","q":"Evidence obtained illegally or improperly by police may be","o":["excluded by the court unless admitting it is in the public interest","automatically admitted","automatically excluded","decided by the jury alone"],"a":0,"x":"Section 138 of the Evidence Act requires a court to weigh the desirability of admitting evidence against the impropriety, so it is not automatically excluded.","ev":[{"id":"evidence-act-1995","t":"Evidence Act 1995 (NSW)"}]},{"id":"n3-17","tp":3,"src":"Practice question","q":"For self-defence to succeed, the accused must have believed their conduct was necessary and it must have been","o":["a reasonable response in the circumstances as the accused perceived them","planned in advance","a response of equal violence","reported to police beforehand"],"a":0,"x":"Self-defence under the Crimes Act has a subjective belief element and an objective reasonableness test. If it succeeds, the accused is acquitted.","ev":[{"id":"defences-to-criminal-charges","t":"Defences to criminal charges"}]},{"id":"n3-18","tp":3,"src":"Practice question","q":"In NSW, jury panels are selected by the Sheriff","o":["randomly from the electoral roll","by the prosecution","by the judge's choice","from lawyers and police only"],"a":0,"x":"Random selection from the electoral roll aims for a representative jury. Both sides can then challenge some potential jurors.","ev":[{"id":"jury-act-1977","t":"Jury Act 1977 (NSW)"}]},{"id":"n3-19","tp":3,"src":"Practice question","q":"Which reason might lead an accused to choose a judge-alone trial?","o":["Concern that publicity or complex evidence may stop a jury being fair","To avoid a verdict being reasoned","To reduce the standard of proof","To avoid the prosecution case"],"a":0,"x":"Judge-alone trials may be sought where publicity or complex evidence could prejudice a jury. The standard of proof does not change.","ev":[{"id":"bocsar-cjb264-judge-alone-trials","t":"BOCSAR CJB 264 (judge-alone trials)"}]},{"id":"n3-20","tp":3,"src":"Practice question","q":"After an accused is acquitted, which statement is generally correct?","o":["They cannot be tried again for the same offence, subject to limited statutory exceptions","They can be retried at the prosecution's choice","They must pay the court costs","They have a criminal record for the charge"],"a":0,"x":"Double jeopardy protects against repeated prosecution for the same offence. Statute allows retrials only in narrow cases, such as fresh and compelling evidence for very serious offences.","ev":[{"id":"crimes-appeal-and-review-act-2001","t":"Appeals legislation (NSW)"}]},{"id":"p2012q2","tp":3,"src":"Past HSC 2012 Q2","q":"What is the purpose of a committal hearing?","o":["To charge the accused","To establish the state's case","To enter into charge negotiation","To empanel a jury from the electoral roll"],"a":1,"x":"At a <b>committal hearing</b> a magistrate tests whether the prosecution case is strong enough (a prima facie case) to send the accused to a higher court for trial. It does not decide guilt.","ev":[{"id":"the-adversary-system-and-court-jurisdiction","t":"Jurisdiction and the adversary system"}]},{"id":"p2013q1","tp":3,"src":"Past HSC 2013 Q1","q":"What is the standard of proof in a criminal case?","o":["Beyond any doubt","Beyond reasonable doubt","On the balance of possibilities","On the balance of probabilities"],"a":1,"x":"The standard of proof in criminal cases is <b>beyond reasonable doubt</b>. 'On the balance of probabilities' is the civil standard.","ev":[{"id":"woolmington-v-dpp-1935","t":"Woolmington v DPP"}]},{"id":"p2015q2","tp":3,"src":"Past HSC 2015 Q2","q":"Which of the following best describes criminal law in NSW?","o":["Public law that uses the adversary system","Public law that uses the inquisitorial system","Private law that uses the adversary system","Private law that uses the inquisitorial system"],"a":0,"x":"Criminal law is <b>public law</b> (the State prosecutes) and NSW uses the <b>adversary system</b>: two opposing parties and an impartial decision maker.","ev":[{"id":"the-adversary-system-and-court-jurisdiction","t":"Jurisdiction and the adversary system"}]},{"id":"p2017q12","tp":3,"src":"Past HSC 2017 Q12","q":"Which type of hearing establishes if there is a prima facie case?","o":["Appeal","Committal","Coronial","Summary"],"a":1,"x":"A <b>committal hearing</b> decides whether a prima facie case exists. Appeals, coronial inquests and summary hearings have different purposes.","ev":[{"id":"criminal-procedure-act-1986","t":"Criminal Procedure Act 1986 (NSW)"}]},{"id":"p2017q17","tp":3,"src":"Past HSC 2017 Q17","q":"Why does the Director of Public Prosecutions issue Prosecution Guidelines?","o":["To assist a magistrate to reach an informed decision","To reduce the costs involved in running a defence case","To help prosecution barristers to make a legal aid application","To guide prosecutors and inform the public about actions taken in its name"],"a":3,"x":"The DPP's Prosecution Guidelines <b>guide prosecutors and inform the public</b> about how decisions such as charging and charge negotiation are made. They support consistency and transparency.","ev":[{"id":"odpp-prosecution-guidelines","t":"ODPP Prosecution Guidelines"}]},{"id":"p2018q14","tp":3,"src":"Past HSC 2018 Q14","q":"Of the following, the person most likely to be granted legal aid under NSW law is a person","o":["who pleads guilty.","involved in a divorce.","accused of a serious crime.","appealing a criminal conviction."],"a":2,"x":"Legal aid is targeted at disadvantaged people and prioritises serious criminal matters, so someone <b>accused of a serious crime</b> is most likely to receive it.","ev":[{"id":"legal-representation-and-legal-aid","t":"Legal representation and legal aid"}]},{"id":"p2019q6","tp":3,"src":"Past HSC 2019 Q6","q":"The prosecution and defence agree an offender will plead guilty to manslaughter instead of being tried for murder. What is this agreement an example of?","o":["A partial defence","Charge negotiation","A complete defence","Alternative sentencing"],"a":1,"x":"An agreement to plead guilty to a lesser charge instead of facing a more serious one is <b>charge negotiation</b>. It saves time and gives certainty, but must be approved by the prosecutor under the guidelines.","ev":[{"id":"odpp-prosecution-guidelines","t":"ODPP Prosecution Guidelines"}]},{"id":"p2021q16","tp":3,"src":"Past HSC 2021 Q16","q":"In NSW, a judge can accept a majority verdict from a jury","o":["after the police prosecutor presents their case.","at the conclusion of a matter heard summarily.","at the conclusion of a Commonwealth criminal trial.","after they have deliberated for at least eight hours."],"a":3,"x":"A judge may accept a <b>majority verdict</b> (11 to 1) only after the jury has deliberated for at least eight hours and the judge is satisfied that more deliberation would not produce unanimity.","ev":[{"id":"jury-act-1977","t":"Jury Act 1977 (NSW)"}]},{"id":"p2023q19","tp":3,"src":"Past HSC 2023 Q19","q":"Kim pleads not guilty to a charge of murder. Kim’s request for a trial without a jury is granted. Which of the following applies to the trial?","o":["Kim will have to prove his innocence.","The judge will provide reasons for the verdict.","The case will be decided on the balance of probabilities.","A plea bargain will determine the length of the sentence."],"a":1,"x":"A judge-alone trial has no jury, so the judge decides guilt and must give <b>written reasons for the verdict</b>. The prosecution still carries the burden of proof beyond reasonable doubt.","ev":[{"id":"bocsar-cjb264-judge-alone-trials","t":"BOCSAR CJB 264 (judge-alone trials)"}]},{"id":"p2025q14","tp":3,"src":"Past HSC 2025 Q14","q":"Which of the following is a key difference between a trial by jury and a judge-alone trial?","o":["A judge must provide reasons for the verdict.","A judge-alone trial is less likely to result in an acquittal.","Only a jury can decide if the victim has received justice.","A jury is better equipped to resolve complex and prejudicial issues."],"a":0,"x":"A key difference is transparency: a judge-alone trial produces <b>reasons for the verdict</b>, while a jury delivers a verdict without reasons.","ev":[{"id":"bocsar-cjb264-judge-alone-trials","t":"BOCSAR CJB 264 (judge-alone trials)"}]},{"id":"n4-11","tp":4,"src":"Practice question","q":"Which of the following is NOT a purpose of sentencing under section 3A of the Crimes (Sentencing Procedure) Act 1999?","o":["To pay compensation to the offender's family","To deter the offender and others","To protect the community","To promote rehabilitation"],"a":0,"x":"Section 3A lists punishment, deterrence, protection of the community, rehabilitation, accountability, denunciation and recognising harm to victims.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"n4-12","tp":4,"src":"Practice question","q":"In Muldrock v The Queen (2011) the High Court held that the standard non-parole period is","o":["a legislative guidepost, not the starting point for sentencing","a mandatory minimum","a maximum penalty","irrelevant to sentencing"],"a":0,"x":"<i>Muldrock</i> overturned the 'starting point' approach: judges consider all the circumstances and use the SNPP as a guidepost.","ev":[{"id":"muldrock-v-the-queen-2011","t":"Muldrock v The Queen"}]},{"id":"n4-13","tp":4,"src":"Practice question","q":"Bugmy v The Queen (2013) confirmed that","o":["a deprived background can mitigate a sentence, but there is no special principle for Aboriginal offenders as a class","Aboriginal offenders must receive a lower sentence","background is irrelevant to sentencing","deprivation reduces over time so it can be ignored"],"a":0,"x":"The High Court said courts must consider an offender's background of deprivation, but sentencing is based on individual circumstances.","ev":[{"id":"bugmy-v-the-queen-2013","t":"Bugmy v The Queen"}]},{"id":"n4-14","tp":4,"src":"Practice question","q":"An early guilty plea can reduce a sentence by up to about","o":["25%","10%","50%","75%"],"a":0,"x":"Courts apply a discount of up to 25 per cent for an early guilty plea, recognising utility and remorse. The discount lowers with later pleas.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"n4-15","tp":4,"src":"Practice question","q":"Circle sentencing in NSW is mainly designed to","o":["involve Aboriginal Elders and the community in the sentencing process","send offenders to prison","replace the magistrate","allow victims to set the penalty"],"a":0,"x":"A magistrate leads a circle with Elders, the offender and victim support. It aims to increase community confidence and reduce reoffending.","ev":[{"id":"circle-sentencing-and-walama","t":"Circle sentencing and the Walama List"}]},{"id":"n4-16","tp":4,"src":"Practice question","q":"Which sentence allows an offender to serve a prison sentence of up to two years in the community under supervision?","o":["Intensive Correction Order","Fine","Forfeiture of assets","Continued detention"],"a":0,"x":"An Intensive Correction Order is a sentence of imprisonment served in the community with strict conditions as an alternative to full-time custody.","ev":[{"id":"bocsar-cjb207-ico","t":"BOCSAR CJB 207"}]},{"id":"n4-17","tp":4,"src":"Practice question","q":"Which body can order continued detention or extended supervision of a high-risk offender after their sentence ends?","o":["The Supreme Court of NSW","The Local Court","The police commissioner","The jury"],"a":0,"x":"Under the Crimes (High Risk Offenders) Act 2006 the Supreme Court can order extended supervision or continued detention to protect the community.","ev":[{"id":"crimes-high-risk-offenders-act-2006","t":"Crimes (High Risk Offenders) Act 2006"}]},{"id":"n4-18","tp":4,"src":"Practice question","q":"The Victims Rights and Support Act 2013 provides victims of crime with","o":["access to counselling and financial support","the power to choose the sentence","the right to appeal an acquittal","the right to cross-examine the accused"],"a":0,"x":"The Act sets out a Charter of Rights and the Victims Support Scheme, offering counselling and financial assistance but not control over prosecution or sentence.","ev":[{"id":"victims-rights-and-support-act-2013","t":"Victims Rights and Support Act 2013"}]},{"id":"n4-19","tp":4,"src":"Practice question","q":"The DPP may appeal a sentence on the ground that it is","o":["manifestly inadequate","too lenient only because the victim disagrees","too similar to previous sentences","delivered by a magistrate"],"a":0,"x":"Crown sentence appeals are limited to sentences that are manifestly inadequate, which respects the offender's interest in finality.","ev":[{"id":"crimes-appeal-and-review-act-2001","t":"Appeals legislation (NSW)"}]},{"id":"n4-20","tp":4,"src":"Practice question","q":"Mandatory minimum sentences such as those in the one-punch laws reduce","o":["judicial discretion","the maximum penalty","the burden of proof","the role of the police"],"a":0,"x":"Mandatory sentences limit the judge's ability to weigh individual circumstances, which is why they are controversial.","ev":[{"id":"one-punch-laws-mandatory-sentencing","t":"One-punch laws and mandatory sentencing"}]},{"id":"p2011q14","tp":4,"src":"Past HSC 2011 Q14","q":"Which of the following is a feature of victim impact statements in NSW?","o":["They are required by the court.","They are presented at sentencing.","They are used in determining guilt.","They are part of the prosecution case."],"a":1,"x":"Victim impact statements are <b>presented at sentencing</b>, not during the trial. They tell the court about the harm suffered but do not decide guilt.","ev":[{"id":"victims-rights-and-support-act-2013","t":"Victims Rights and Support Act 2013"}]},{"id":"p2013q5","tp":4,"src":"Past HSC 2013 Q5","q":"Which of the following is a mitigating circumstance in a sentencing decision?","o":["The offender is young.","The offender used a weapon.","The offender has a prior conviction.","The offender believed what he or she did was right."],"a":0,"x":"Youth is a <b>mitigating</b> factor because it reduces the offender's culpability and increases prospects of rehabilitation. A weapon and prior convictions are aggravating.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"p2014q13","tp":4,"src":"Past HSC 2014 Q13","q":"The purpose of specific deterrence in sentencing is to","o":["direct the offender to undertake education and training.","direct the offender to complete a community service order.","discourage the offender from committing the offence again.","discourage others who may consider committing a similar offence."],"a":2,"x":"<b>Specific deterrence</b> aims to discourage the offender in front of the court from reoffending. Discouraging others is general deterrence.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"p2016q11","tp":4,"src":"Past HSC 2016 Q11","q":"An offender and the victim of the crime attend a meeting to discuss the impact of the crime on the victim. What is this an example of?","o":["Retribution","Restorative justice","Charge negotiation","A community service order"],"a":1,"x":"Bringing an offender and victim together to discuss the harm is <b>restorative justice</b>. It focuses on repairing harm rather than punishing.","ev":[{"id":"circle-sentencing-and-walama","t":"Circle sentencing and the Walama List"}]},{"id":"p2016q19","tp":4,"src":"Past HSC 2016 Q19","q":"Which of the following is true of judicial guidelines?","o":["They are set by the parliament to structure law making processes.","They are set by the NSW Law Reform Commission to provide for fairness.","They are set by the Director of Public Prosecutions to guide judges in decision making.","They are set by the NSW Court of Criminal Appeal to assist judges when applying discretion."],"a":3,"x":"<b>Guideline judgments</b> are set by the NSW Court of Criminal Appeal to promote consistency. Parliament sets statutory guidelines such as maximum penalties.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"p2017q3","tp":4,"src":"Past HSC 2017 Q3","q":"A person is sentenced to imprisonment for a period of five years. The person thinks the sentence is too long and decides to appeal. What type of appeal can this best be described as?","o":["Appeal against bias","Appeal against severity","Appeal on a point of law","Appeal on the conviction"],"a":1,"x":"Challenging a sentence as too harsh is an <b>appeal against severity</b>. An appeal against conviction challenges the finding of guilt.","ev":[{"id":"crimes-appeal-and-review-act-2001","t":"Appeals legislation (NSW)"}]},{"id":"p2020q9","tp":4,"src":"Past HSC 2020 Q9","q":"While serving a custodial sentence, a murderer writes a book about her crime. She is not permitted to keep the money from the book sales. This means that a court has made an order for","o":["continued detention.","the payment of a fine.","the forfeiture of assets.","participation in a rehabilitation program."],"a":2,"x":"An order stopping an offender profiting from a crime is <b>forfeiture of assets</b>. It removes proceeds of crime and underpins confiscation laws.","ev":[{"id":"crimes-sentencing-procedure-act-1999","t":"CSPA 1999 (NSW)"}]},{"id":"p2021q14","tp":4,"src":"Past HSC 2021 Q14","q":"Which body has discretion to determine the early release of a prisoner before they complete their full sentence?","o":["NSW Police Force","State Parole Authority","NSW Sentencing Council","Office of the Director of Public Prosecutions"],"a":1,"x":"The <b>State Parole Authority</b> decides whether a prisoner may be released early on parole under the Crimes (Administration of Sentences) Act 1999.","ev":[{"id":"crimes-administration-of-sentences-act-1999","t":"Crimes (Administration of Sentences) Act 1999"}]},{"id":"p2022q8","tp":4,"src":"Past HSC 2022 Q8","q":"Joe is in prison and provides evidence to the police which leads to the conviction of another prisoner. Which of the following is Joe likely to experience?","o":["Protective custody","Extended detention","Preventative detention","A diversionary program"],"a":0,"x":"Protecting a prisoner who is at risk after informing on others is <b>protective custody</b>. Preventative detention is used to prevent a future offence.","ev":[{"id":"crimes-administration-of-sentences-act-1999","t":"Crimes (Administration of Sentences) Act 1999"}]},{"id":"p2024q13","tp":4,"src":"Past HSC 2024 Q13","q":"Which of the following is a feature of a NSW Criminal Infringement Notice (CIN)?","o":["It is issued by a court.","It cannot be overturned in court.","It is an alternative to court prosecution.","It is always followed by a court proceeding."],"a":2,"x":"A Criminal Infringement Notice (CIN) is issued by police as an <b>alternative to court prosecution</b> for minor offences. It can be challenged in court.","ev":[{"id":"summary-offences-act-1988","t":"Summary Offences Act 1988 (NSW)"}]},{"id":"n5-10","tp":5,"src":"Practice question","q":"A key aim of the Young Offenders Act 1997 is to","o":["divert young offenders from court where appropriate","impose longer sentences on young people","remove their right to a lawyer","make all hearings public"],"a":0,"x":"The Act provides alternatives to formal prosecution that hold the young person accountable while encouraging rehabilitation.","ev":[{"id":"young-offenders-act-1997","t":"YOA 1997 (NSW)"}]},{"id":"n5-11","tp":5,"src":"Practice question","q":"The presumption of doli incapax in NSW applies to children aged","o":["10 to under 14","under 10 only","14 to 17","10 to 18"],"a":0,"x":"Children under 10 cannot be criminally responsible. For 10 to 13, the prosecution must rebut the presumption of doli incapax.","ev":[{"id":"dpp-nsw-v-nw-doli-incapax","t":"DPP (NSW) v NW"}]},{"id":"n5-12","tp":5,"src":"Practice question","q":"In RP v The Queen (2016) the High Court emphasised that to rebut doli incapax the prosecution must","o":["prove the child knew the act was seriously wrong, with evidence beyond the act itself","show the child was naughty","prove the child was over 12","rely only on the seriousness of the offence"],"a":0,"x":"<i>RP</i> stresses that the presumption protects children and must be rebutted by evidence of the child's understanding of seriously wrong conduct.","ev":[{"id":"rp-v-the-queen-2016","t":"RP v The Queen"}]},{"id":"n5-13","tp":5,"src":"Practice question","q":"Under the Children (Criminal Proceedings) Act 1987, the media is generally prohibited from","o":["publishing the name of a child involved in criminal proceedings","reporting the sentence","attending any court","reporting the offence type"],"a":0,"x":"Name suppression protects young people's privacy and rehabilitation prospects.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"n5-14","tp":5,"src":"Practice question","q":"Which is a feature of the Children's Court?","o":["Proceedings are closed to the public and heard by a magistrate without a jury","Cases are heard by a jury","Hearings are always open to the media","It deals with adult offenders"],"a":0,"x":"The Children's Court is a specialised, closed court focused on rehabilitation, using a magistrate rather than a jury.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"n5-15","tp":5,"src":"Practice question","q":"The Youth Koori Court differs from an ordinary Children's Court because it","o":["involves Elders and creates an action plan with the young person","uses a jury","only deals with adults","has no magistrate"],"a":0,"x":"It is a culturally appropriate sentencing court where Elders and support people help a young Aboriginal person address the causes of offending.","ev":[{"id":"bocsar-cjb248-youth-koori-court","t":"BOCSAR CJB 248 (Youth Koori Court)"}]},{"id":"n5-16","tp":5,"src":"Practice question","q":"A youth justice conference brings together","o":["the young person, the victim, a convenor and support people","a jury and a judge","police and the media","the young person's employer only"],"a":0,"x":"Conferences are a restorative process in which participants agree on an outcome plan to repair harm.","ev":[{"id":"bocsar-cjb160-yjc","t":"BOCSAR CJB 160"}]},{"id":"n5-17","tp":5,"src":"Practice question","q":"Which is a reason for treating young offenders differently from adults?","o":["They are still maturing and have greater potential for rehabilitation","They are less likely to reoffend","They commit only minor crimes","They have no legal rights"],"a":0,"x":"Developmental differences and rehabilitation prospects justify specialised courts, diversion and sentencing principles.","ev":[{"id":"young-offenders-in-the-cjs","t":"Young offenders in the CJS"}]},{"id":"n5-18","tp":5,"src":"Practice question","q":"Queensland's 'adult crime, adult time' laws are an example of","o":["a punitive approach to young offenders that moves away from rehabilitation","a diversionary program","a restorative justice conference","an international treaty"],"a":0,"x":"These laws increase penalties for serious youth offending and have been criticised for reducing the emphasis on rehabilitation.","ev":[{"id":"queensland-adult-crime-adult-time","t":"Queensland 'adult crime, adult time'"}]},{"id":"n5-19","tp":5,"src":"Practice question","q":"A 16-year-old is charged with armed robbery. The matter will most likely be heard in the","o":["Children's Court","Coroner's Court","High Court","Drug Court"],"a":0,"x":"Most offences by children are dealt with in the Children's Court. Only the most serious indictable offences are heard in higher courts.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"n5-20","tp":5,"src":"Practice question","q":"Which statement about the minimum age of criminal responsibility in NSW is correct?","o":["Children under 10 cannot be held criminally responsible","Children under 12 cannot be charged","Children under 14 cannot be charged","There is no minimum age"],"a":0,"x":"The minimum age is 10. Between 10 and 13, doli incapax requires proof that the child understood the act was seriously wrong.","ev":[{"id":"doli-incapax-diversion-reforms-2025","t":"Doli incapax and diversion reforms (2025–26)"}]},{"id":"n5-9","tp":5,"src":"Practice question","q":"Under the Young Offenders Act 1997 (NSW), which order lists responses from least to most formal?","o":["Warning, caution, youth justice conference, Children's Court","Children's Court, caution, warning, conference","Conference, warning, court, caution","Caution, court, conference, warning"],"a":0,"x":"The Act provides a hierarchy of diversion: warnings, cautions and conferences before court, for eligible offences.","ev":[{"id":"young-offenders-act-1997","t":"YOA 1997 (NSW)"}]},{"id":"p2013q16","tp":5,"src":"Past HSC 2013 Q16","q":"The Children's Court decides that a 15-year-old should be sent to a juvenile justice centre for twelve months. What is this an example of?","o":["Probation","A control order","A suspended sentence","A diversionary program"],"a":1,"x":"Detention of a young person in a juvenile justice centre is a <b>control order</b>. It is available only when other options are inappropriate.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"p2019q16","tp":5,"src":"Past HSC 2019 Q16","q":"A 12-year-old child is on trial for a crime. The prosecution must show that the necessary mens rea was present when the child committed the crime. Which of the following must the prosecution prove?","o":["The child knew they were misbehaving.","The child knew the act was morally wrong.","The child disobeyed the directions of an adult.","The child did not care whether the act was criminal."],"a":1,"x":"For a child aged 10 to 13 the prosecution must prove the child knew the act was <b>seriously wrong</b> (morally wrong), not just naughty. This is the doli incapax presumption.","ev":[{"id":"dpp-nsw-v-nw-doli-incapax","t":"DPP (NSW) v NW"}]},{"id":"p2020q11","tp":5,"src":"Past HSC 2020 Q11","q":"What should be the last option a court considers when sentencing a young offender convicted of an offence?","o":["Fine","Control order","Youth justice conference","Community service order"],"a":1,"x":"Detention in a <b>control order</b> must be the last option. Fines, community service and youth justice conferences are tried first.","ev":[{"id":"young-offenders-in-the-cjs","t":"Young offenders in the CJS"}]},{"id":"p2020q7","tp":5,"src":"Past HSC 2020 Q7","q":"A young offender wants to appeal his conviction by a magistrate in the Children’s Court. Which court would first hear this appeal?","o":["District","High","Local","Supreme"],"a":0,"x":"Appeals from the Children's Court on a conviction go to the <b>District Court</b> first, as for the Local Court.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"p2021q15","tp":5,"src":"Past HSC 2021 Q15","q":"The Children (Criminal Proceedings) Act 1987 (NSW) provides young offenders with which of the following rights?","o":["Have all matters heard by a jury","Be given a warning for first offence","No requirement to provide identification to police","Have an adult support person present when questioned"],"a":3,"x":"The Children (Criminal Proceedings) Act 1987 gives young people the right to have an <b>adult support person</b> present when questioned by police.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"p2021q2","tp":5,"src":"Past HSC 2021 Q2","q":"What is the minimum age at which children can be held criminally responsible in NSW?","o":["10","14","16","18"],"a":0,"x":"The minimum age of criminal responsibility in NSW is <b>10</b>. Children aged 10 to 13 are presumed incapable (doli incapax) unless the prosecution rebuts that presumption.","ev":[{"id":"doli-incapax-diversion-reforms-2025","t":"Doli incapax and diversion reforms (2025–26)"}]},{"id":"p2022q17","tp":5,"src":"Past HSC 2022 Q17","q":"Sam is 13 years old. They are arrested and fingerprinted. Under what circumstances can police officers conduct this type of forensic procedure?","o":["With a court order","With Sam’s consent","When Sam is arrested for an offence","At the request of the Director of Public Prosecutions"],"a":0,"x":"Forensic procedures such as fingerprinting on a child as young as 13 require a <b>court order</b>, which is an extra safeguard for young suspects under the forensic procedures laws.","ev":[{"id":"crimes-forensic-procedures-act-2000","t":"Forensic Procedures Act 2000 (NSW)"}]},{"id":"p2023q14","tp":5,"src":"Past HSC 2023 Q14","q":"Michael is a 17-year-old on trial for murder. Which of the following is correct?","o":["Michael’s trial will be in the Supreme Court.","Michael’s trial will be in front of a magistrate.","Michael cannot be held criminally responsible.","Michael will be required to prove his innocence."],"a":0,"x":"Murder is a serious children's indictable offence, so a 17-year-old is tried in the <b>Supreme Court</b>, with a jury, not in the Children's Court.","ev":[{"id":"children-criminal-proceedings-act-1987","t":"CCPA 1987 (NSW)"}]},{"id":"n6-11","tp":6,"src":"Practice question","q":"The ICC has jurisdiction over which crimes?","o":["Genocide, crimes against humanity, war crimes and aggression","Drug trafficking and fraud","Theft and assault","Cybercrime and money laundering"],"a":0,"x":"The Rome Statute gives the ICC jurisdiction over four core crimes of international concern.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"n6-12","tp":6,"src":"Practice question","q":"The principle of complementarity means the ICC acts only when","o":["national courts are unwilling or unable to genuinely prosecute","a state asks for a trial","the UN General Assembly votes","the accused agrees"],"a":0,"x":"The ICC is a court of last resort. States have the primary responsibility to investigate and prosecute.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"n6-13","tp":6,"src":"Practice question","q":"A major limitation on the ICC when seeking to enforce the Putin warrant is that it","o":["has no police force and relies on states to arrest suspects","cannot issue warrants","only tries states","has no judges"],"a":0,"x":"The ICC relies on state cooperation. Russia is not a party to the Rome Statute and does not recognise the warrant.","ev":[{"id":"putin-warrant-icc-2023","t":"The Putin warrant"}]},{"id":"n6-14","tp":6,"src":"Practice question","q":"In South Africa v Israel the International Court of Justice resolves","o":["a dispute between states","the guilt of individuals","domestic criminal appeals","extradition requests"],"a":0,"x":"The ICJ hears disputes between states. The ICC tries individuals.","ev":[{"id":"south-africa-v-israel-icj","t":"South Africa v Israel (ICJ)"}]},{"id":"n6-15","tp":6,"src":"Practice question","q":"The UN Convention against Transnational Organised Crime (UNTOC) encourages states to","o":["cooperate and criminalise participation in organised crime groups","create a world police force","replace domestic courts","abolish extradition"],"a":0,"x":"UNTOC provides a framework for international cooperation, including mutual legal assistance and extradition.","ev":[{"id":"untoc-and-cybercrime-convention","t":"UNTOC and the UN Cybercrime Convention"}]},{"id":"n6-16","tp":6,"src":"Practice question","q":"Extradition from Australia to another country is regulated by","o":["the Extradition Act 1988 (Cth)","the Bail Act 2013 (NSW)","the Jury Act 1977 (NSW)","the Children (Criminal Proceedings) Act 1987"],"a":0,"x":"The Commonwealth Act sets out the process for requests, including judicial and ministerial decisions.","ev":[{"id":"extradition-act-1988","t":"Extradition Act 1988 (Cth)"}]},{"id":"n6-17","tp":6,"src":"Practice question","q":"Which Australian laws address human trafficking and slavery offences?","o":["Criminal Code (Cth) and the Modern Slavery Act","Bail Act 2013 (NSW)","Evidence Act 1995","Jury Act 1977"],"a":0,"x":"Commonwealth laws criminalise trafficking and slavery and require large entities to report on modern slavery risks.","ev":[{"id":"modern-slavery-in-australia","t":"Modern slavery in Australia"}]},{"id":"n6-18","tp":6,"src":"Practice question","q":"The ICTY was","o":["an ad hoc tribunal set up by the UN Security Council to prosecute crimes in the former Yugoslavia","a permanent court","a domestic Australian court","a court for civil disputes"],"a":0,"x":"The ICTY (1993 to 2017) was a temporary tribunal and a forerunner to the permanent ICC.","ev":[{"id":"icty-1993-2017","t":"ICTY"}]},{"id":"n6-19","tp":6,"src":"Practice question","q":"A key difficulty in investigating transnational crime is that","o":["laws and jurisdiction differ between countries and evidence may be held overseas","all countries have identical laws","police have unlimited powers abroad","there are no international agreements"],"a":0,"x":"Differences in laws, sovereignty and the location of evidence make cooperation essential.","ev":[{"id":"international-crime-evidence-summary-2026","t":"International crime evidence summary"}]},{"id":"n6-20","tp":6,"src":"Practice question","q":"Australia's use of targeted cyber sanctions after the Medibank hack is an example of","o":["a non-judicial response to transnational crime","an ICC prosecution","a domestic sentencing option","extradition"],"a":0,"x":"Sanctions impose financial and travel restrictions on individuals without a trial, supplementing judicial responses.","ev":[{"id":"cyber-sanctions-medibank","t":"Cyber sanctions (Medibank)"}]},{"id":"p2011q16","tp":6,"src":"Past HSC 2011 Q16","q":"Which of the following is best characterised as transnational crime?","o":["Murder","Torture","Sexual assault","People smuggling"],"a":3,"x":"<b>People smuggling</b> crosses borders and involves more than one state, so it is a transnational crime. Murder, torture and sexual assault are typically domestic offences.","ev":[{"id":"aap-2026-weipa-people-smuggling","t":"People smuggling at Weipa (2026)"}]},{"id":"p2012q14","tp":6,"src":"Past HSC 2012 Q14","q":"What comes under the jurisdiction of the International Criminal Court?","o":["War crimes","Cyber-terrorism","Drug trafficking","People smuggling"],"a":0,"x":"The ICC deals with <b>war crimes</b>, genocide, crimes against humanity and aggression. Drug trafficking and people smuggling are transnational crimes dealt with by domestic courts.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"p2013q7","tp":6,"src":"Past HSC 2013 Q7","q":"Which of the following is the best example of a transnational crime?","o":["Torture","Genocide","War crimes","Human trafficking"],"a":3,"x":"<b>Human trafficking</b> moves people across borders for exploitation, a transnational crime. Torture, genocide and war crimes are crimes against the international community.","ev":[{"id":"modern-slavery-in-australia","t":"Modern slavery in Australia"}]},{"id":"p2014q16","tp":6,"src":"Past HSC 2014 Q16","q":"Which of the following is true of the International Criminal Court?","o":["It is an ad hoc tribunal.","It is established by a treaty.","It deals with transnational crimes.","It is the judicial arm of the United Nations."],"a":1,"x":"The ICC is <b>established by a treaty</b> (the Rome Statute 1998). It is permanent, not ad hoc, and is independent of the United Nations.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"p2016q7","tp":6,"src":"Past HSC 2016 Q7","q":"The president of a nation state is accused of war crimes. Where would this case be prosecuted?","o":["International Criminal Court","International Court of Justice","United Nations Security Council","United Nations Human Rights Council"],"a":0,"x":"War crimes allegedly committed by a head of state fall under the <b>ICC</b>, which prosecutes individuals. The ICJ resolves disputes between states.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"p2020q10","tp":6,"src":"Past HSC 2020 Q10","q":"On the orders of his government, a submarine commander launches a nuclear missile at another country. The commander’s actions are primarily an example of","o":["a transnational crime.","an environmental crime.","an offence against the sovereign.","a crime against the international community."],"a":3,"x":"Launching a nuclear missile on a government's orders could be a crime against the <b>international community</b> such as a war crime or crime of aggression, not a transnational crime.","ev":[{"id":"international-crime-evidence-summary-2026","t":"International crime evidence summary"}]},{"id":"p2021q12","tp":6,"src":"Past HSC 2021 Q12","q":"An Australian citizen is accused of committing a serious crime in Canada before returning to Australia. Canada requests the return of the accused for trial. Australia agrees to the request. This request refers to which of the following?","o":["Extradition","Deportation","Prisoner exchange","International committal hearing"],"a":0,"x":"Sending a suspect to another country to face charges is <b>extradition</b>, governed in Australia by the Extradition Act 1988 (Cth). Deportation removes a non-citizen.","ev":[{"id":"extradition-act-1988","t":"Extradition Act 1988 (Cth)"}]},{"id":"p2022q4","tp":6,"src":"Past HSC 2022 Q4","q":"Charlie was caught smuggling illegal substances into Australia from Mozambique. She was arrested and charged upon her arrival into Australia. Which court would hear this matter?","o":["An Australian court","A Mozambican court","The International Criminal Court","The International Court of Justice"],"a":0,"x":"Importing drugs into Australia breaches Australian law, so an <b>Australian court</b> hears it. International courts do not deal with this transnational crime.","ev":[{"id":"criminal-code-cth-transnational-offences","t":"Criminal Code (Cth): transnational offences"}]},{"id":"p2023q7","tp":6,"src":"Past HSC 2023 Q7","q":"Which of the following is an example of a crime against the international community?","o":["Fraud","Genocide","Drug importation","People smuggling"],"a":1,"x":"<b>Genocide</b> is a crime against the international community, prosecuted at the ICC. Fraud, drug importation and people smuggling are transnational or domestic crimes.","ev":[{"id":"rome-statute-1998","t":"Rome Statute and the ICC Act 2002"}]},{"id":"p2024q17","tp":6,"src":"Past HSC 2024 Q17","q":"How does Australia’s criminal justice system address transnational crime?","o":["By collaborating with international law enforcement agencies","By excluding transnational crimes from prosecution within Australia","By solely relying on the jurisdiction from where the crime originated","By imposing sanctions on countries with high levels of transnational crime"],"a":0,"x":"Australia responds to transnational crime by <b>collaborating with international law enforcement</b>, for example through extradition, mutual assistance and shared intelligence.","ev":[{"id":"international-crime-evidence-summary-2026","t":"International crime evidence summary"}]}];
const TOPICS={1:['Nature of crime','🧩'],2:['Criminal investigation','🔎'],3:['Criminal trial process','🏛️'],4:['Sentencing & punishment','🔨'],5:['Young offenders','🧒'],6:['International crime','🌏']};
const KEY='lsmcq-crime-v1';
let mem={};
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))||{q:{}}}catch(e){return mem.d||{q:{}}}},
 set(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){mem.d=d}}};
const $=s=>document.querySelector(s), app=$('#app');
let sel=new Set([1,2,3,4,5,6]), S=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const col=t=>`style="--c:var(--t${t})"`;
function stats(){const d=store.get();let a=0,c=0,w=0;DATA.forEach(q=>{const r=d.q[q.id];if(r){a++;c+=r.c;if(!r.l)w++}});
 let tot=0,cor=0;Object.values(d.q).forEach(r=>{tot+=r.n;cor+=r.c});return{a,acc:tot?Math.round(cor/tot*100):null,w,d}}
function home(){
 S=null;const st=stats();
 const weakN=DATA.filter(q=>sel.has(q.tp)&&st.d.q[q.id]&&!st.d.q[q.id].l).length;
 const pool=DATA.filter(q=>sel.has(q.tp)).length;
 app.innerHTML=`<div style="height:14px"></div>
 <div class="stats"><div class="stat"><b>${st.a}/${DATA.length}</b><small>questions tried</small></div>
 <div class="stat"><b>${st.acc===null?'–':st.acc+'%'}</b><small>overall accuracy</small></div>
 <div class="stat"><b>${st.w}</b><small>weak questions</small></div></div>
 <h2>1. Choose topics</h2><div class="card"><div class="chips">${Object.keys(TOPICS).map(t=>`<button class="chip" ${col(t)} data-t="${t}" aria-pressed="${sel.has(+t)}">${TOPICS[t][1]} ${t}. ${TOPICS[t][0]}</button>`).join('')}</div>
 <div class="row"><button class="btn alt" id="all">All topics</button><button class="btn alt" id="none">Clear</button><span style="align-self:center;color:var(--ink2)">${pool} questions selected</span></div></div>
 <h2>2. Pick a mode</h2><div class="modes">
 <button class="mode" style="--m:var(--teal)" id="m1" ${pool?'':'disabled'}><span class="e">✏️</span><b>Practice</b><span>10 questions with instant feedback, an explanation and an Evidence Finder link.</span></button>
 <button class="mode" style="--m:var(--harbour)" id="m2" ${pool?'':'disabled'}><span class="e">⏱️</span><b>Timed test</b><span>20 questions in 30 minutes. Feedback and score at the end.</span></button>
 <button class="mode" style="--m:var(--coral)" id="m3" ${weakN?'':'disabled'}><span class="e">🎯</span><b>Retry weak spots</b><span>${weakN} question${weakN==1?'':'s'} you last got wrong in the selected topics.</span></button></div>
 <h2>Your progress by topic</h2><div class="tgrid">${Object.keys(TOPICS).map(t=>{const qs=DATA.filter(q=>q.tp==t);let right=0,tried=0;qs.forEach(q=>{const r=st.d.q[q.id];if(r){tried++;if(r.l)right++}});
  return`<div class="topic" ${col(t)}><b>${TOPICS[t][1]} ${t}. ${TOPICS[t][0]}</b><small>${right} mastered · ${tried} tried · ${qs.length} total</small><div class="bar"><i style="width:${right/qs.length*100}%"></i></div></div>`}).join('')}</div>
 <p style="margin-top:14px;color:var(--ink2);font-size:13px">Progress is saved in this browser only. 'Mastered' means your last attempt was correct.</p>
 <button class="link" id="reset">Reset my progress</button>`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;sel.has(t)?sel.delete(t):sel.add(t);home()});
 $('#all').onclick=()=>{sel=new Set([1,2,3,4,5,6]);home()};$('#none').onclick=()=>{sel.clear();home()};
 $('#m1').onclick=()=>start('practice',10);$('#m2').onclick=()=>start('test',20);$('#m3').onclick=()=>start('weak',99);
 $('#reset').onclick=()=>{if(confirm('Clear all saved progress?')){store.set({q:{}});home()}};
}
function start(mode,n,ids){
 const d=store.get();let pool;
 if(ids)pool=DATA.filter(q=>ids.includes(q.id));
 else if(mode=='weak')pool=DATA.filter(q=>sel.has(q.tp)&&d.q[q.id]&&!d.q[q.id].l);
 else{pool=DATA.filter(q=>sel.has(q.tp));
  // prefer unseen, then previously wrong, then the rest
  const rank=q=>{const r=d.q[q.id];return !r?0:(!r.l?1:2)};
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b)).slice(0,n);}
 const qs=shuffle(pool).slice(0,n).map(q=>{const o=shuffle(q.o.map((t,i)=>({t,ok:i==q.a})));return{...q,opts:o}});
 S={mode,qs,i:0,ans:[],t0:Date.now(),left:30*60,done:false};
 if(mode=='test'){S.tm=setInterval(()=>{S.left--;const e=$('#tm');if(e){e.textContent=fmt(S.left);e.classList.toggle('low',S.left<300)}if(S.left<=0)finish()},1000)}
 show();
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function show(){
 const q=S.qs[S.i],test=S.mode=='test',a=S.ans[S.i];
 app.innerHTML=`<div class="top"><span class="pill" ${col(q.tp)}>${TOPICS[q.tp][1]} ${TOPICS[q.tp][0]}</span><span class="pill src">${esc(q.src)}</span><span class="sp"></span>${test?`<span class="timer" id="tm">${fmt(S.left)}</span>`:''}<button class="btn alt" id="quit">${test?'Submit now':'End'}</button></div>
 <div class="prog"><i style="width:${S.i/S.qs.length*100}%"></i></div>
 <div class="card"><div style="color:var(--ink2);font-size:13px;margin-bottom:4px">Question ${S.i+1} of ${S.qs.length}</div><div class="q">${esc(q.q)}</div>
 <div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
 <div id="fb"></div><div class="row"><button class="btn" id="next" disabled>${S.i==S.qs.length-1?'Finish':'Next'} →</button></div></div>`;
 const opts=[...document.querySelectorAll('.opt')];
 const mark=()=>{opts.forEach((b,i)=>{b.disabled=!test;b.classList.toggle('sel',test&&a!==undefined&&a===i)});$('#next').disabled=a===undefined};
 opts.forEach((b,i)=>b.onclick=()=>pick(i));
 $('#next').onclick=next;$('#quit').onclick=()=>{if(!test||confirm('Submit the test now? Unanswered questions score zero.'))finish()};
 if(a!==undefined&&!test){reveal(a)}else if(test){opts.forEach(b=>b.disabled=false);mark();opts.forEach((b,i)=>b.disabled=false)}
}
function pick(i){
 const q=S.qs[S.i],test=S.mode=='test';
 S.ans[S.i]=i;
 if(test){document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j==i));$('#next').disabled=false;return}
 record(q,q.opts[i].ok);reveal(i);
}
function reveal(i){
 const q=S.qs[S.i];
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('right');else if(j==i)b.classList.add('wrong')});
 const ok=q.opts[i].ok;
 $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><h3>${ok?'✔ Correct':'✘ Not quite'}${ok?'':' — the answer is '+'ABCD'[q.opts.findIndex(o=>o.ok)]}</h3><div>${q.x}</div>${q.ev.length?`<div class="ev">📚 See in the Evidence Finder: ${q.ev.map(e=>`<a href="../evidence.html#ev-${e.id}" target="_blank" rel="noopener">${esc(e.t)}</a>`).join('')}</div>`:''}</div>`;
 $('#next').disabled=false;$('#next').focus();
}
function record(q,ok){const d=store.get();const r=d.q[q.id]||{n:0,c:0,l:false};r.n++;if(ok)r.c++;r.l=ok;d.q[q.id]=r;store.set(d)}
function next(){S.i<S.qs.length-1?(S.i++,show()):finish()}
function finish(){
 if(S.done)return;S.done=true;clearInterval(S.tm);
 const test=S.mode=='test';
 if(test)S.qs.forEach((q,i)=>{if(S.ans[i]!==undefined)record(q,q.opts[S.ans[i]].ok)});
 const tried=S.qs.map((q,i)=>S.ans[i]!==undefined);
 const right=S.qs.map((q,i)=>tried[i]&&q.opts[S.ans[i]].ok);
 const sc=right.filter(Boolean).length,n=S.qs.length,pct=Math.round(sc/n*100);
 const by={};S.qs.forEach((q,i)=>{(by[q.tp]=by[q.tp]||{c:0,n:0});by[q.tp].n++;if(right[i])by[q.tp].c++});
 const wrongIds=S.qs.filter((q,i)=>tried[i]&&!right[i]).map(q=>q.id);
 const secs=test?30*60-S.left:Math.round((Date.now()-S.t0)/1000);
 const msg=pct>=80?'Excellent work!':pct>=60?'Solid. Keep going.':'Good start. Review the explanations below.';
 app.innerHTML=`<div style="height:14px"></div><div class="card score"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><h2 style="margin:0">${sc} / ${n} correct</h2><div style="color:var(--ink2)">${msg} Time: ${fmt(secs)}${tried.includes(false)?` · ${tried.filter(x=>!x).length} unanswered`:''}</div></div></div>
 <h2>Score by topic</h2><div class="tgrid">${Object.keys(by).map(t=>`<div class="topic" ${col(t)}><b>${TOPICS[t][1]} ${TOPICS[t][0]}</b><small>${by[t].c} / ${by[t].n}</small><div class="bar"><i style="width:${by[t].c/by[t].n*100}%"></i></div></div>`).join('')}</div>
 <div class="row"><button class="btn" id="again">Back to start</button>${wrongIds.length?`<button class="btn alt" id="rw">Retry the ${wrongIds.length} I got wrong</button>`:''}</div>
 <h2>Review</h2>${S.qs.map((q,i)=>`<details class="rv ${right[i]?'ok':'no'}"><summary>${i+1}. ${esc(q.q)}</summary><div class="b">${q.opts.map((o,j)=>`<div style="padding:2px 0${o.ok?';color:var(--ok);font-weight:700':S.ans[i]===j?';color:var(--bad)':''}">${'ABCD'[j]}. ${esc(o.t)}${o.ok?' ✔':S.ans[i]===j?' ✘ (your answer)':''}</div>`).join('')}<p style="margin-top:6px">${q.x}</p>${q.ev.map(e=>`<a href="../evidence.html#ev-${e.id}" target="_blank" rel="noopener" style="font-size:13px;margin-right:8px">📚 ${esc(e.t)}</a>`).join('')}</div></details>`).join('')}`;
 $('#again').onclick=home;if($('#rw'))$('#rw').onclick=()=>start('practice',99,wrongIds);
}
document.addEventListener('keydown',e=>{if(!S||S.done||!$('#opts'))return;
 const k=e.key.toUpperCase(),i='ABCD'.indexOf(k)>=0?'ABCD'.indexOf(k):'1234'.indexOf(k);
 if(i>=0&&i<4&&(S.mode=='test'||S.ans[S.i]===undefined)){pick(i);return}
 if((e.key=='Enter'||e.key=='ArrowRight')&&!$('#next').disabled)next()});
home();
</script>
</body>
</html>
